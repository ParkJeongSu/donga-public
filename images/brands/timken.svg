  <g transform="translate(10, 11)">
    <!-- Trapezoid Tapered Roller Body -->
    <polygon points="3,0 15,2 13,18 1,16" fill="#F58220"/>
    <polygon points="5,2.2 13,3.6 11.5,16.4 3.5,15" fill="#FFA048"/>
