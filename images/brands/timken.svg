    <path d="M93 11.5h3.4l6.8 10.2V11.5h3.4v16.7h-3.2l-7-10.5v10.5H93V11.5z"/>
  </g>
  <!-- Bottom Brand Orange Rule -->
  <rect x="29" y="32.5" width="81" height="2" rx="1" fill="#F58220"/>
</svg>
