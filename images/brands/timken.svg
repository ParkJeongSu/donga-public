    <line x1="1" y1="8.5" x2="15" y2="10.2" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>
  <!-- TIMKEN Bold Logotype in Deep Slate / Black -->
  <g fill="#1E293B">
