<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="lmBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="lmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <linearGradient id="lmRailSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="lmBlockBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lmEndSeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="lmNipple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#f8fafc" />
  <circle cx="300" cy="225" r="210" fill="url(#lmBgGlow)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.15" stroke="#0284c7" stroke-width="0.75" stroke-dasharray="4,4">
    <line x1="300" y1="20" x2="300" y2="430" />
    <line x1="20" y1="225" x2="580" y2="225" />
  </g>

  <!-- Linear Motion Guide & Carriage Block Assembly (Isometric Perspective) -->
  <g filter="url(#lmShadow)" transform="translate(40, 20)">

    <!-- Long Precision Linear Rail -->
    <!-- Rail Base & Side Profile -->
    <path d="M60,250 L460,110 L460,170 L60,310 Z" fill="url(#lmRailSteel)" stroke="#64748b" stroke-width="2" />
    <path d="M60,310 L460,170 L460,195 L60,335 Z" fill="#334155" stroke="#475569" stroke-width="1.5" />

    <!-- Rail Top Surface -->
    <path d="M60,250 L115,230 L515,90 L460,110 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Rail Ball Raceway Grooves on Both Sides -->
    <path d="M60,275 L460,135" stroke="#0284c7" stroke-width="3" opacity="0.9" />
    <path d="M60,285 L460,145" stroke="#0284c7" stroke-width="3" opacity="0.9" />

    <!-- Rail Counterbored Bolt Mounting Holes -->
    <!-- Hole 1 -->
    <g transform="translate(130, 225) skewX(-35)">
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#475569" stroke="#94a3b8" stroke-width="1" />
      <ellipse cx="0" cy="0" rx="9" ry="4.5" fill="#0f172a" />
    </g>
    <!-- Hole 2 -->
    <g transform="translate(260, 180) skewX(-35)">
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#475569" stroke="#94a3b8" stroke-width="1" />
      <ellipse cx="0" cy="0" rx="9" ry="4.5" fill="#0f172a" />
    </g>
    <!-- Hole 3 -->
    <g transform="translate(390, 135) skewX(-35)">
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#475569" stroke="#94a3b8" stroke-width="1" />
      <ellipse cx="0" cy="0" rx="9" ry="4.5" fill="#0f172a" />
    </g>

    <!-- LM Carriage Block Mounted in the Center -->
    <!-- Carriage Main Body -->
    <g transform="translate(190, 120)">
      <!-- Main Block 3D Isometric Body -->
      <path d="M30,120 L160,75 L160,145 L30,190 Z" fill="url(#lmBlockBody)" stroke="#0ea5e9" stroke-width="2" />
      <path d="M30,120 L80,95 L210,50 L160,75 Z" fill="#475569" stroke="#64748b" stroke-width="1.5" />
      <path d="M80,95 L210,50 L210,120 L160,145 L160,75 Z" fill="#1e293b" />

      <!-- High Precision Datum Grinding Surface (Top Plate) -->
      <path d="M38,122 L75,103 L195,62 L158,81 Z" fill="#94a3b8" opacity="0.4" />

      <!-- End Seal Cap (Front Red/Industrial Accent) -->
      <path d="M22,123 L32,119 L32,192 L22,196 Z" fill="url(#lmEndSeal)" stroke="#b91c1c" stroke-width="1" />
      <!-- End Seal Cap (Rear) -->
      <path d="M208,51 L218,47 L218,122 L208,126 Z" fill="url(#lmEndSeal)" stroke="#b91c1c" stroke-width="1" />

      <!-- Grease Nipple on Front Center -->
      <g transform="translate(20, 155)">
        <polygon points="0,0 -8,-3 -8,5 0,8" fill="url(#lmNipple)" stroke="#854d0e" stroke-width="0.8" />
        <circle cx="-9" cy="2" r="3" fill="#ca8a04" />
      </g>

      <!-- 4 Threaded Mounting Holes on Block Flange -->
      <!-- Hole 1 -->
      <ellipse cx="65" cy="115" rx="5" ry="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
      <!-- Hole 2 -->
      <ellipse cx="115" cy="98" rx="5" ry="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
      <!-- Hole 3 -->
      <ellipse cx="110" cy="80" rx="5" ry="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />
      <!-- Hole 4 -->
      <ellipse cx="160" cy="63" rx="5" ry="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" />

      <!-- Recirculating Steel Ball Bearings Under Lip -->
      <g fill="#e2e8f0" stroke="#475569" stroke-width="0.8">
        <circle cx="50" cy="180" r="4.5" />
        <circle cx="65" cy="175" r="4.5" />
        <circle cx="80" cy="170" r="4.5" />
        <circle cx="95" cy="165" r="4.5" />
        <circle cx="110" cy="160" r="4.5" />
      </g>

      <!-- Laser Marking on Block -->
      <text x="75" y="145" fill="#38bdf8" font-family="'Pretendard', sans-serif" font-size="9" font-weight="800" transform="rotate(-19, 75, 145)">THK / SBC COMPATIBLE</text>
    </g>

    <!-- Motion Direction Arrow Indicator -->
    <g transform="translate(390, 80) rotate(-19)" opacity="0.85">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#0284c7" stroke-width="3" stroke-dasharray="4,2" />
      <polygon points="65,0 55,-5 55,5" fill="#0284c7" />
      <text x="10" y="-8" fill="#0284c7" font-family="'Pretendard', sans-serif" font-size="9" font-weight="700">LINEAR MOTION</text>
    </g>
  </g>

  <!-- Technical Spec Badge in SVG -->
  <g font-family="'Pretendard', sans-serif">
    <rect x="25" y="25" width="145" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#lmShadow)" />
    <text x="37" y="44" font-size="11" font-weight="800" fill="#0284c7">LM GUIDE &amp; BALLSCREW</text>
    <text x="37" y="58" font-size="10" font-weight="600" fill="#475569">THK · SBC · IKO 전 규격</text>

    <rect x="430" y="380" width="145" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#lmShadow)" />
    <text x="442" y="399" font-size="11" font-weight="800" fill="#0284c7">당일 정밀 절단 &amp; 가공</text>
    <text x="442" y="413" font-size="10" font-weight="600" fill="#64748b">반도체 · 공작기계 맞춤</text>
  </g>
</svg>
