<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bbBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="bbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <radialGradient id="ballShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>
    <linearGradient id="bbSteelOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="bbSteelInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="steelCage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#f8fafc" />
  <circle cx="300" cy="225" r="210" fill="url(#bbBgGlow)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.15" stroke="#0284c7" stroke-width="0.75" stroke-dasharray="4,4">
    <line x1="300" y1="20" x2="300" y2="430" />
    <line x1="20" y1="225" x2="580" y2="225" />
    <circle cx="300" cy="225" r="180" fill="none" />
    <circle cx="300" cy="225" r="125" fill="none" />
  </g>

  <!-- Deep Groove Ball Bearing Assembly -->
  <g filter="url(#bbShadow)">
    <!-- Outer Ring -->
    <circle cx="300" cy="225" r="170" fill="url(#bbSteelOuter)" stroke="#64748b" stroke-width="2.5" />
    <circle cx="300" cy="225" r="158" fill="#334155" />
    <circle cx="300" cy="225" r="152" fill="url(#bbSteelOuter)" />
    
    <!-- Outer Deep Groove Ball Track (Concave Dark) -->
    <circle cx="300" cy="225" r="142" fill="#1e293b" />

    <!-- Pressed Steel Ribbon Cage Body -->
    <circle cx="300" cy="225" r="125" fill="none" stroke="url(#steelCage)" stroke-width="18" stroke-dasharray="24, 25" />
    <circle cx="300" cy="225" r="125" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2, 47" />

    <!-- Highly Polished Chrome Steel Bearing Balls (8 Balls, Ø42mm each) -->
    <!-- Ball 1: 0 deg (Top) -->
    <circle cx="300" cy="100" r="21" fill="url(#ballShine)" stroke="#475569" stroke-width="1" />
    <ellipse cx="294" cy="94" rx="6" ry="4" fill="#ffffff" opacity="0.8" />
    <!-- Ball 2: 45 deg -->
    <circle cx="388" cy="137" r="21" fill="url(#ballShine)" stroke="#475569" stroke-width="1" />
    <ellipse cx="382" cy="131" rx="6" ry="4" fill="#ffffff" opacity="0.8" />
    <!-- Ball 3: 90 deg (Right) -->
    <circle cx="425" cy="225" r="21" fill="url(#ballShine)" stroke="#475569" stroke-width="1" />
    <ellipse cx="419" cy="219" rx="6" ry="4" fill="#ffffff" opacity="0.8" />
    <!-- Ball 4: 135 deg -->
    <circle cx="388" cy="313" r="21" fill="url(#ballShine)" stroke="#475569" stroke-width="1" />
    <ellipse cx="382" cy="307" rx="6" ry="4" fill="#ffffff" opacity="0.8" />
    <!-- Ball 5: 180 deg (Bottom) -->
    <circle cx="300" cy="350" r="21" fill="url(#ballShine)" stroke="#475569" stroke-width="1" />
    <ellipse cx="294" cy="344" rx="6" ry="4" fill="#ffffff" opacity="0.8" />
    <!-- Ball 6: 225 deg -->
    <circle cx="212" cy="313" r="21" fill="url(#ballShine)" stroke="#475569" stroke-width="1" />
    <ellipse cx="206" cy="307" rx="6" ry="4" fill="#ffffff" opacity="0.8" />
    <!-- Ball 7: 270 deg (Left) -->
    <circle cx="175" cy="225" r="21" fill="url(#ballShine)" stroke="#475569" stroke-width="1" />
    <ellipse cx="169" cy="219" rx="6" ry="4" fill="#ffffff" opacity="0.8" />
    <!-- Ball 8: 315 deg -->
    <circle cx="212" cy="137" r="21" fill="url(#ballShine)" stroke="#475569" stroke-width="1" />
    <ellipse cx="206" cy="131" rx="6" ry="4" fill="#ffffff" opacity="0.8" />

    <!-- Inner Ring Raceway & Chamfer -->
    <circle cx="300" cy="225" r="108" fill="#1e293b" />
    <circle cx="300" cy="225" r="98" fill="url(#bbSteelInner)" stroke="#475569" stroke-width="2" />
    <circle cx="300" cy="225" r="88" fill="#334155" />
    <circle cx="300" cy="225" r="82" fill="url(#bbSteelInner)" />

    <!-- Bore Hole (Shaft Fit d) -->
    <circle cx="300" cy="225" r="68" fill="#0f172a" />
    <path d="M232,225 A68,68 0 0,0 368,225 A68,48 0 0,1 232,225 Z" fill="#020617" opacity="0.65" />

    <!-- Specular Arc Highlights -->
    <path d="M165,135 A170,170 0 0,1 435,135" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75" />
    <path d="M225,185 A100,100 0 0,1 375,185" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.75" />
  </g>

  <!-- Technical Spec Badge in SVG -->
  <g font-family="'Pretendard', sans-serif">
    <rect x="25" y="25" width="135" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#bbShadow)" />
    <text x="37" y="44" font-size="11" font-weight="800" fill="#0284c7">PRECISION BALL</text>
    <text x="37" y="58" font-size="10" font-weight="600" fill="#475569">6200 · 6000 · 7200</text>

    <rect x="440" y="380" width="135" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#bbShadow)" />
    <text x="452" y="399" font-size="11" font-weight="800" fill="#0284c7">동아베어링 상시 재고</text>
    <text x="452" y="413" font-size="10" font-weight="600" fill="#64748b">SKF · NSK · FAG 정품</text>
  </g>
</svg>
