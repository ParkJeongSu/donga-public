<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Background glow & shadows -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
    <filter id="rollerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>

    <!-- Metallic Steel Gradients -->
    <linearGradient id="outerSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="innerSteel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="20%" stop-color="#f1f5f9" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="racewaySteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brassCage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="rollerCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="rollerEnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="cutawayEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>

  <!-- Background Soft Radial Glow -->
  <circle cx="400" cy="325" r="300" fill="url(#heroGlow)" />

  <!-- Technical Axis and Precision Grid Lines -->
  <g opacity="0.3" stroke="#0284c7" stroke-width="1" stroke-dasharray="6,4">
    <line x1="400" y1="40" x2="400" y2="610" />
    <line x1="120" y1="325" x2="680" y2="325" />
    <circle cx="400" cy="325" r="280" fill="none" stroke="#0ea5e9" stroke-width="0.75" />
    <circle cx="400" cy="325" r="140" fill="none" stroke="#0ea5e9" stroke-width="0.75" />
  </g>

  <!-- Main 3D Perspective Bearing Assembly with Cutaway -->
  <g filter="url(#dropShadow)" transform="translate(0, 0)">

    <!-- Outer Ring Base Shadow & Outer Rim -->
    <ellipse cx="400" cy="325" rx="265" ry="245" fill="url(#outerSteel)" stroke="#64748b" stroke-width="3" />
    <ellipse cx="400" cy="325" rx="252" ry="232" fill="#475569" />
    <ellipse cx="400" cy="325" rx="246" ry="226" fill="url(#outerSteel)" />

    <!-- Outer Ring Raceway (Concave Surface) -->
    <ellipse cx="400" cy="325" rx="226" ry="208" fill="url(#racewaySteel)" />
    <ellipse cx="400" cy="325" rx="220" ry="202" fill="#1e293b" />

    <!-- Brass Machined Cage Ring -->
    <ellipse cx="400" cy="325" rx="192" ry="176" fill="url(#brassCage)" stroke="#a16207" stroke-width="2" />
    <ellipse cx="400" cy="325" rx="156" ry="144" fill="#0f172a" />

    <!-- Inner Ring Raceway & Metallic Chamfer -->
    <ellipse cx="400" cy="325" rx="146" ry="134" fill="url(#innerSteel)" stroke="#475569" stroke-width="2" />
    <ellipse cx="400" cy="325" rx="136" ry="124" fill="#334155" />
    <ellipse cx="400" cy="325" rx="124" ry="114" fill="url(#innerSteel)" />

    <!-- Bore (Bore Hole d = 200mm+) -->
    <ellipse cx="400" cy="325" rx="110" ry="100" fill="#0f172a" />
    <!-- Inner Shaft Shadow -->
    <path d="M290,325 A110,100 0 0,0 510,325 A110,70 0 0,1 290,325 Z" fill="#020617" opacity="0.8" />

    <!-- Rolling Elements (Spherical / Barrel Rollers around circumference) -->
    <!-- Top -->
    <g transform="translate(400, 138) rotate(0)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <!-- Specular Highlight -->
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Top Right 30 deg -->
    <g transform="translate(495, 165) rotate(30)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Right 60 deg -->
    <g transform="translate(565, 238) rotate(60)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Right 90 deg -->
    <g transform="translate(585, 325) rotate(90)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Bottom Right 120 deg -->
    <g transform="translate(560, 412) rotate(120)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Bottom Right 150 deg -->
    <g transform="translate(490, 480) rotate(150)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Bottom -->
    <g transform="translate(400, 508) rotate(180)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Bottom Left 210 deg -->
    <g transform="translate(305, 480) rotate(210)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Left 240 deg -->
    <g transform="translate(235, 412) rotate(240)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Left 270 deg -->
    <g transform="translate(215, 325) rotate(270)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Top Left 300 deg -->
    <g transform="translate(238, 238) rotate(300)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- Top Left 330 deg -->
    <g transform="translate(308, 165) rotate(330)" filter="url(#rollerShadow)">
      <rect x="-18" y="-28" width="36" height="56" rx="12" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="1.2" />
      <ellipse cx="0" cy="-22" rx="14" ry="5" fill="url(#rollerEnd)" />
      <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    </g>

    <!-- 3D Precision Cutaway Section (Quarter Section Showing Ring Cross Profile) -->
    <!-- Cutaway Planes in Blue Steel finish with hatching & precision dimension markers -->
    <g transform="translate(400, 325)">
      <!-- Cut plane 1 (Vertical cut line upward) -->
      <path d="M0,0 L0,-245 L-42,-243 L-42,-100 L0,0" fill="url(#cutawayEdge)" opacity="0.95" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Cut plane 2 (Horizontal cut line leftward) -->
      <path d="M0,0 L-265,0 L-263,-42 L-100,-42 L0,0" fill="url(#cutawayEdge)" opacity="0.88" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Internal Raceways Profile Cut -->
      <path d="M-110,0 L-146,0 L-146,-15 C-146,-35 -136,-42 -110,-42 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
      <path d="M-226,0 L-265,0 L-265,-42 C-240,-42 -226,-35 -226,-15 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <!-- Precision Hatching Lines -->
      <line x1="-12" y1="-12" x2="-28" y2="-4" stroke="#e0f2fe" stroke-width="1" opacity="0.6" />
      <line x1="-24" y1="-24" x2="-44" y2="-8" stroke="#e0f2fe" stroke-width="1" opacity="0.6" />
      <line x1="-36" y1="-36" x2="-60" y2="-12" stroke="#e0f2fe" stroke-width="1" opacity="0.6" />
      <line x1="-48" y1="-48" x2="-76" y2="-16" stroke="#e0f2fe" stroke-width="1" opacity="0.6" />
    </g>

    <!-- High-Sheen Outer Ring Highlight Arc -->
    <path d="M185,190 A265,245 0 0,1 615,190" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.65" />
    <path d="M220,165 A246,226 0 0,1 580,165" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

    <!-- Center Tech Ring / Laser Engraving Marking -->
    <path id="textArc" d="M270,325 A130,120 0 0,1 530,325" fill="none" stroke="none" />
    <text fill="#64748b" font-family="'Pretendard', sans-serif" font-size="9" font-weight="700" letter-spacing="3">
      <textPath href="#textArc" startOffset="50%" text-anchor="middle">
        DONGA PRECISION · GERMANY / JAPAN TECH COMPLIANT · SUJ2 HIGH-CARB
      </textPath>
    </text>
  </g>

  <!-- Technical Callout Overlays -->
  <g font-family="'Pretendard', sans-serif">
    <!-- Callout 1: Outer Diameter (D) -->
    <g transform="translate(670, 160)">
      <circle cx="0" cy="0" r="4" fill="#0284c7" />
      <line x1="0" y1="0" x2="-35" y2="40" stroke="#0284c7" stroke-width="1.5" />
      <rect x="0" y="-18" width="105" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" filter="url(#rollerShadow)" />
      <text x="10" y="-3" font-size="10" font-weight="700" fill="#0f172a">외경 Ø2,000mm</text>
      <text x="10" y="10" font-size="8" font-weight="600" fill="#0284c7">초대형 규격 대응</text>
    </g>

    <!-- Callout 2: Precision Hardened Raceways -->
    <g transform="translate(110, 480)">
      <circle cx="0" cy="0" r="4" fill="#059669" />
      <line x1="0" y1="0" x2="60" y2="-45" stroke="#059669" stroke-width="1.5" />
      <rect x="-95" y="-18" width="100" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" filter="url(#rollerShadow)" />
      <text x="-85" y="-3" font-size="10" font-weight="700" fill="#0f172a">황동 일체형 케이지</text>
      <text x="-85" y="10" font-size="8" font-weight="600" fill="#059669">고하중·진동 방지</text>
    </g>

    <!-- Callout 3: Precision Bore (d) -->
    <g transform="translate(400, 325)">
      <circle cx="0" cy="0" r="3" fill="#0284c7" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2" />
    </g>
  </g>
</svg>
